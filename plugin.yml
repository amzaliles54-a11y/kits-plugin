name: MistFFAKits
version: 1.0.0
main: net.mistsmp.kits.MistKitsPlugin
api-version: '1.21'
author: MistSMP
description: Native high-performance kit and token management system for Mist FFA.

commands:
  kits:
    description: Opens the kit selector GUI.
  kitadmin:
    description: Opens the kit layout manager.
  givetoken:
    permission: op
    description: Gives kill tokens or compressed tokens to players.
  kitrename:
    permission: op
    description: Renames an existing kit.
